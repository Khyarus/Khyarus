<svg fill="none" viewBox="0 0 900 1350" width="100%" height="100%" xmlns="http://www.w3.org/2000/svg">
  <foreignObject width="100%" height="100%">
    <div xmlns="http://www.w3.org/1999/xhtml">
      <style>
        @import url('https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;600;700&amp;display=swap');

        * { box-sizing: border-box; }

        .container {
          background-color: #0d1117;
          border-radius: 16px;
          border: 1.5px solid #30363d;
          font-family: 'Fira Code', monospace;
          padding: 0;
          width: 100%;
          color: #c9d1d9;
          box-shadow: 0 20px 40px rgba(0, 0, 0, 0.6);
          overflow: hidden;
        }

        .header {
          background: #161b22;
          padding: 12px 20px;
          display: flex;
          align-items: center;
          border-bottom: 1.5px solid #30363d;
        }

        .dots { display: flex; gap: 8px; }
        .dot { width: 12px; height: 12px; border-radius: 50%; }
        .red { background-color: #ff5f56; }
        .yellow { background-color: #ffbd2e; }
        .green { background-color: #27c93f; }

        .title {
          margin-left: auto;
          margin-right: auto;
          color: #8b949e;
          font-size: 13px;
          font-weight: 600;
          letter-spacing: 0.5px;
        }

        .body { padding: 28px; font-size: 13.5px; line-height: 1.6; }

        .prompt { color: #39d353; font-weight: 700; }
        .path { color: #58a6ff; font-weight: 600; }
        .cmd { color: #e6edf3; }
        .comment { color: #8b949e; font-style: italic; }

        .hero-title {
          font-size: 24px;
          font-weight: 700;
          margin: 12px 0 4px 0;
          background: linear-gradient(90deg, #58a6ff, #bc8cff, #39d353, #58a6ff);
          background-size: 300% 100%;
          -webkit-background-clip: text;
          -webkit-text-fill-color: transparent;
          animation: gradientShift 6s ease infinite;
        }

        @keyframes gradientShift {
          0% { background-position: 0% 50%; }
          50% { background-position: 100% 50%; }
          100% { background-position: 0% 50%; }
        }

        .hero-sub { color: #8b949e; font-size: 14px; margin-bottom: 16px; }

        .typewriter {
          display: inline-block;
          overflow: hidden;
          white-space: nowrap;
          border-right: 2px solid #58a6ff;
          animation: typing 3.5s steps(45, end), blink 0.8s infinite;
        }

        @keyframes typing { from { width: 0; } to { width: 100%; } }
        @keyframes blink { 0%, 100% { border-color: transparent; } 50% { border-color: #58a6ff; } }

        .yaml-card {
          background: #161b22;
          border: 1px solid #30363d;
          border-left: 4px solid #bc8cff;
          border-radius: 8px;
          padding: 14px 18px;
          margin: 14px 0;
          font-size: 13px;
        }

        .yaml-key { color: #79c0ff; font-weight: 600; }
        .yaml-val { color: #a5d6ff; }

        .social-group { display: flex; gap: 10px; margin: 16px 0; flex-wrap: wrap; }
        .social-btn {
          display: inline-flex;
          align-items: center;
          gap: 6px;
          padding: 6px 14px;
          border-radius: 6px;
          font-size: 12px;
          font-weight: 700;
          text-decoration: none;
          color: #ffffff;
        }
        .bg-linkedin { background: #0a66c2; }
        .bg-github { background: #21262d; border: 1px solid #30363d; }
        .bg-email { background: #d14836; }

        .section-title {
          font-size: 15px;
          font-weight: 700;
          color: #58a6ff;
          margin: 22px 0 10px 0;
          display: flex;
          align-items: center;
          gap: 8px;
        }

        /* Projetos */
        .project-card {
          background: #161b22;
          border: 1px solid #30363d;
          border-left: 4px solid #39d353;
          border-radius: 8px;
          padding: 14px 18px;
          margin-bottom: 14px;
        }

        .project-header {
          display: flex;
          justify-content: space-between;
          align-items: center;
          margin-bottom: 6px;
        }

        .project-title {
          color: #39d353;
          font-weight: 700;
          font-size: 14px;
          text-decoration: none;
        }

        .project-tag {
          background: #21262d;
          border: 1px solid #30363d;
          color: #8b949e;
          font-size: 11px;
          padding: 2px 8px;
          border-radius: 12px;
        }

        /* Timeline de Experiência e Educação */
        .timeline {
          border-left: 2px solid #30363d;
          padding-left: 16px;
          margin-left: 6px;
        }

        .timeline-item {
          position: relative;
          margin-bottom: 14px;
        }

        .timeline-item::before {
          content: '';
          position: absolute;
          left: -21px;
          top: 6px;
          width: 8px;
          height: 8px;
          border-radius: 50%;
          background-color: #58a6ff;
          box-shadow: 0 0 8px #58a6ff;
        }

        .item-role { color: #f0f6fc; font-weight: 700; font-size: 13.5px; }
        .item-company { color: #bc8cff; font-weight: 600; font-size: 12.5px; }
        .item-date { color: #8b949e; font-size: 11.5px; margin-bottom: 3px; }
        .item-desc { color: #8b949e; font-size: 12px; line-height: 1.4; }

        .tech-grid {
          display: grid;
          grid-template-columns: repeat(auto-fit, minmax(120px, 1fr));
          gap: 8px;
          margin-bottom: 14px;
        }

        .tech-badge {
          background: #161b22;
          border: 1px solid #30363d;
          padding: 6px 10px;
          border-radius: 6px;
          text-align: center;
          font-size: 11.5px;
          font-weight: 600;
          color: #c9d1d9;
        }

        .progress-bar-bg {
          width: 100%;
          height: 6px;
          background: #21262d;
          border-radius: 4px;
          overflow: hidden;
          margin-top: 6px;
        }
        .progress-bar-fill {
          height: 100%;
          width: 100%;
          background: linear-gradient(90deg, #58a6ff, #39d353);
          border-radius: 4px;
          animation: fillProgress 2.5s ease-out;
        }
        @keyframes fillProgress { from { width: 0%; } to { width: 100%; } }
      </style>

      <div class="container">
