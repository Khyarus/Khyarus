          <div class="dots">
            <div class="dot red"></div>
            <div class="dot yellow"></div>
            <div class="dot green"></div>
          </div>
          <div class="title">bash — khyarus@dev-station:~</div>
        </div>

        <div class="body">
          <!-- Execução -->
          <div>
            <span class="prompt">➜ </span><span class="path">~/workspace </span><span class="cmd">./initialize_profile.sh</span>
          </div>

          <!-- Cabeçalho -->
          <div class="hero-title">⚡ JOÃO GABRIEL CANSI SILVEIRA</div>
          <div class="hero-sub">Full Stack Developer | Computer Engineering Student @ UNINGÁ</div>

          <!-- Botoes -->
          <div class="social-group">
            <a href="https://linkedin.com/in/joao-gabriel-cansi-silveira" target="_blank" class="social-btn bg-linkedin">
              <span>LinkedIn</span>
            </a>
            <a href="https://github.com/Khyarus" target="_blank" class="social-btn bg-github">
              <span>GitHub</span>
            </a>
            <a href="mailto:PugDerpy@gmail.com" class="social-btn bg-email">
              <span>Email</span>
            </a>
          </div>

          <!-- Resumo YAML -->
          <div class="yaml-card">
            <div><span class="yaml-key">foco:</span> <span class="yaml-val">Desenvolvimento Web, APIs REST, Microsserviços e Engenharia de Software</span></div>
            <div><span class="yaml-key">localizacao:</span> <span class="yaml-val">Maringá / Marialva, PR - Brasil</span></div>
            <div><span class="yaml-key">bio:</span> <span class="yaml-val">Curioso por qualquer tecnologia que resolva problemas reais do mundo produtivo.</span></div>
          </div>

          <!-- Projetos Open Source -->
          <div class="section-title">🚀 PROJETOS OPEN SOURCE</div>
          <div class="project-card">
            <div class="project-header">
              <a href="https://github.com/Khyarus/pulse-php" target="_blank" class="project-title">📦 PulsePHP (jgcansi/pulse-php)</a>
              <span class="project-tag">PHP / SQLite</span>
            </div>
            <div class="item-desc">Biblioteca de monitoramento leve para aplicações PHP com suporte a armazenamento SQLite e integração com dashboards Laravel.</div>
          </div>

          <!-- Experiência Profissional -->
          <div class="section-title">💼 EXPERIÊNCIA PROFISSIONAL</div>
          <div class="timeline">
            <div class="timeline-item">
              <div class="item-role">Analista de Desenvolvimento Jr</div>
              <div class="item-company">Bellinati Perez</div>
              <div class="item-date">Nov. 2025 — Presente (Híbrido)</div>
              <div class="item-desc">Desenvolvimento e manutenção de aplicações corporativas com PHP puro e Laravel. Manutenção em bancos SQL, análise de demandas, correção de bugs e suporte N3.</div>
            </div>

            <div class="timeline-item">
              <div class="item-role">Estagiário de Desenvolvimento</div>
              <div class="item-company">Bellinati Perez</div>
              <div class="item-date">Nov. 2024 — Nov. 2025 (1 ano)</div>
              <div class="item-desc">Atuação no desenvolvimento de sistemas administrativos internos utilizando PHP, GitLab e metodologias ágeis.</div>
            </div>

            <div class="timeline-item">
              <div class="item-role">Técnico de TI (N2 / Servidesk)</div>
              <div class="item-company">Bellinati Perez</div>
              <div class="item-date">Mar. 2023 — Nov. 2024 (1 ano 9 mos)</div>
              <div class="item-desc">Gestão da infraestrutura local, servidores Windows/Active Directory, manutenção física e suporte técnico à sede de Maringá.</div>
            </div>
          </div>

          <!-- Formação Acadêmica -->
          <div class="section-title">🎓 FORMAÇÃO ACADÊMICA</div>
          <div class="timeline">
            <div class="timeline-item">
              <div class="item-role">Bacharelado em Engenharia de Computação</div>
              <div class="item-company">UNINGÁ - Centro Universitário Ingá</div>
              <div class="item-date">2021 — 2026 (Previsão de Conclusão)</div>
              <div class="item-desc">Sistemas Embarcados, Práticas de Engenharia de Software, Arquitetura de Computadores e Automação.</div>
            </div>
          </div>

          <!-- Tecnologias -->
          <div class="section-title">🛠️ STACK &amp; FERRAMENTAS</div>
          <div class="tech-grid">
            <div class="tech-badge">🐘 PHP / Laravel</div>
            <div class="tech-badge">⚛️️ React / TS</div>
            <div class="tech-badge">⚡ .NET / C#</div>
            <div class="tech-badge">🐹 Go (Golang)</div>
            <div class="tech-badge">🐬 MySQL / SQLite</div>
            <div class="tech-badge">🐳 Docker / Linux</div>
          </div>

          <!-- Status final -->
          <div style="margin-top: 18px;">
            <span class="prompt">➜ </span><span class="path">~/workspace </span><span class="cmd">system --status</span>
          </div>
          <div class="comment" style="margin-top: 4px;">
            <span class="typewriter">> [BUILD SUCCESSFUL] Sistema rodando. Sempre construindo algo novo 🚀</span>
          </div>

          <div class="progress-bar-bg">
            <div class="progress-bar-fill"></div>
          </div>
        </div>
      </div>
    </div>
  </foreignObject>
</svg>
